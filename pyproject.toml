[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evodw-rsi"
version = "0.1.0"
description = "EvoDW-RSI: Reflective Strategy Self-Evolution Framework for Enterprise Data Warehouse (ODPS/Hive) Text-to-SQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "sqlglot>=25.0.0",
    "openai>=1.50.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
]

[project.scripts]
evodw = "src.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
rl = [
    "torch>=2.4.0",
    "transformers>=4.51.0,<5.0.0",
    "peft>=0.14.0",
    "trl>=0.16.0,<1.0.0",
    "bitsandbytes>=0.45.0",
    "datasets>=3.0.0,<5.0.0",
    "accelerate>=1.2.0",
    "huggingface-hub>=0.34.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
